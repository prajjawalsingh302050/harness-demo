<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5d3a"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#1c2230">Backend architecture</text>
  <text x="40" y="68" font-size="14" fill="#5b6475">Flat on purpose: 3 Python files and one SQLite table. Every request is measured, and every query is counted.</text>

  <!-- Client -->
  <rect x="40" y="100" width="240" height="96" rx="12" fill="#eef2f8" stroke="#3b4252" stroke-width="1.5"/>
  <text x="160" y="136" font-size="17" font-weight="700" fill="#1c2230" text-anchor="middle">Browser / load test</text>
  <text x="160" y="160" font-size="13" fill="#5b6475" text-anchor="middle">GET /api/people?limit=5000</text>
  <text x="160" y="180" font-size="13" fill="#5b6475" text-anchor="middle">GET /api/people/15000</text>

  <!-- Vercel routing -->
  <rect x="360" y="100" width="300" height="96" rx="12" fill="#f4f7f5" stroke="#6a9f78" stroke-width="1.5"/>
  <text x="510" y="132" font-size="16" font-weight="700" fill="#2f5d3a" text-anchor="middle">Vercel routing</text>
  <text x="510" y="156" font-size="13" fill="#3b4252" text-anchor="middle">/api/*  →  Python function (below)</text>
  <text x="510" y="176" font-size="13" fill="#3b4252" text-anchor="middle">everything else  →  CDN (public/)</text>
  <line x1="280" y1="138" x2="358" y2="138" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Response legend at top right -->
  <rect x="740" y="100" width="420" height="96" rx="12" fill="#ffffff" stroke="#2f5d3a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="760" y="128" font-size="15" font-weight="700" fill="#2f5d3a">Response</text>
  <text x="760" y="152" font-size="13" fill="#3b4252">JSON body  +  X-DB-Queries: 5001</text>
  <text x="760" y="172" font-size="13" fill="#3b4252">+  Server-Timing: db;dur=…, app;dur=…</text>
  <text x="760" y="188" font-size="11" fill="#5b6475">read by the UI pills and by the latency sensor</text>

  <!-- Function container -->
  <rect x="40" y="236" width="1120" height="520" rx="14" fill="#fafbfc" stroke="#6a9f78" stroke-width="2"/>
  <text x="60" y="264" font-size="17" font-weight="700" fill="#2f5d3a">Python function: FastAPI</text>
  <text x="1140" y="264" font-size="13" fill="#2f5d3a" text-anchor="end">on Vercel: serverless function · locally: uvicorn</text>
  <path d="M510,196 L510,234" fill="none" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- api/index.py -->
  <rect x="60" y="284" width="330" height="300" rx="12" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="80" y="312" font-size="16" font-weight="700" fill="#1c2230">api/index.py</text>
  <text x="80" y="332" font-size="12" fill="#5b6475">entry point Vercel looks for</text>
  <text x="80" y="362" font-size="13" fill="#3b4252">app = FastAPI(docs at /api/docs)</text>
  <rect x="76" y="378" width="298" height="132" rx="8" fill="#eef6f1" stroke="#6a9f78"/>
  <text x="90" y="400" font-size="13" font-weight="700" fill="#2f5d3a">timing_headers middleware</text>
  <text x="90" y="422" font-size="13" fill="#3b4252">1. start counter {queries: 0, ms: 0}</text>
  <text x="90" y="442" font-size="13" fill="#3b4252">2. start stopwatch</text>
  <text x="90" y="462" font-size="13" fill="#3b4252">3. await call_next(request)</text>
  <text x="90" y="482" font-size="13" fill="#3b4252">4. add X-DB-Queries, Server-Timing</text>
  <text x="90" y="500" font-size="11" fill="#5b6475">wraps every request</text>
  <text x="80" y="536" font-size="13" fill="#3b4252">app.include_router(router)</text>
  <text x="80" y="560" font-size="13" fill="#3b4252">serves public/ locally only</text>

  <!-- app/routes.py -->
  <rect x="430" y="284" width="380" height="452" rx="12" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="450" y="312" font-size="16" font-weight="700" fill="#1c2230">app/routes.py</text>
  <text x="450" y="332" font-size="12" fill="#5b6475">APIRouter(prefix="/api"): the 3 endpoints</text>

  <rect x="446" y="346" width="348" height="140" rx="8" fill="#ffffff" stroke="#c2405a" stroke-width="1.8"/>
  <text x="460" y="368" font-size="14" font-weight="700" fill="#1c2230">GET /people?limit=N</text>
  <text x="460" y="388" font-size="12" fill="#3b4252">limit clamped to 1..5000 (default 50)</text>
  <text x="460" y="408" font-size="12" fill="#3b4252">SELECT email … ORDER BY id LIMIT ?</text>
  <text x="460" y="428" font-size="12" fill="#3b4252">for each email: find_by_email()</text>
  <text x="460" y="446" font-size="12" fill="#3b4252">    SELECT … WHERE email = ?   (no index)</text>
  <circle cx="468" cy="470" r="8" fill="#c2405a"/>
  <text x="468" y="474" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="482" y="474" font-size="12" font-weight="700" fill="#c2405a">5,001 queries, each a full table scan</text>

  <rect x="446" y="498" width="348" height="104" rx="8" fill="#ffffff" stroke="#c2405a" stroke-width="1.8"/>
  <text x="460" y="520" font-size="14" font-weight="700" fill="#1c2230">GET /people/{person_id}</text>
  <text x="460" y="540" font-size="12" fill="#3b4252">SELECT … WHERE id = ?   (primary key, fast)</text>
  <text x="460" y="560" font-size="12" fill="#3b4252">no row → person = None → None["id"]</text>
  <circle cx="468" cy="584" r="8" fill="#c2405a"/>
  <text x="468" y="588" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="482" y="588" font-size="12" font-weight="700" fill="#c2405a">TypeError → HTTP 500 (should be 404)</text>

  <rect x="446" y="614" width="348" height="54" rx="8" fill="#ffffff" stroke="#3b4252"/>
  <text x="460" y="636" font-size="14" font-weight="700" fill="#1c2230">GET /health</text>
  <text x="460" y="656" font-size="12" fill="#3b4252">SELECT 1  →  {"status": "ok"}</text>

  <rect x="446" y="680" width="348" height="44" rx="8" fill="#fde8ec" stroke="#c2405a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="468" cy="702" r="8" fill="#c2405a"/>
  <text x="468" y="706" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="482" y="706" font-size="12" font-weight="700" fill="#c2405a">dead code: import json, format_phone()</text>

  <!-- app/db.py -->
  <rect x="850" y="284" width="290" height="300" rx="12" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="870" y="312" font-size="16" font-weight="700" fill="#1c2230">app/db.py</text>
  <text x="870" y="332" font-size="12" fill="#5b6475">all SQL goes through here</text>
  <text x="870" y="362" font-size="13" font-weight="700" fill="#1c2230">connect()</text>
  <text x="870" y="382" font-size="12" fill="#3b4252">read-only (mode=ro), immutable</text>
  <text x="870" y="400" font-size="12" fill="#3b4252">rows readable by name (sqlite3.Row)</text>
  <text x="870" y="432" font-size="13" font-weight="700" fill="#1c2230">query(con, sql, params)</text>
  <text x="870" y="452" font-size="12" fill="#3b4252">1. run SQL with ? params (no injection)</text>
  <text x="870" y="472" font-size="12" fill="#3b4252">2. time it</text>
  <text x="870" y="492" font-size="12" fill="#3b4252">3. count it in this request's counter</text>
  <text x="870" y="510" font-size="11" fill="#5b6475">    (ContextVar: one counter per request)</text>
  <text x="870" y="530" font-size="12" fill="#3b4252">4. ≥ 5 ms → log "slow query …"</text>
  <text x="870" y="560" font-size="11" fill="#5b6475">the log feeds the EXPLAIN evidence</text>

  <!-- arrows between files -->
  <line x1="390" y1="462" x2="428" y2="462" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="810" y1="430" x2="848" y2="430" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="810" y1="540" x2="848" y2="540" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- database -->
  <path d="M870,630 a125,18 0 0,0 250,0 a125,18 0 0,0 -250,0 v84 a125,18 0 0,0 250,0 v-84" fill="#f2f6f8" stroke="#0b3d4f" stroke-width="1.8"/>
  <text x="995" y="666" font-size="15" font-weight="700" fill="#0b3d4f" text-anchor="middle">data/shop.db</text>
  <text x="995" y="686" font-size="12" fill="#3b4252" text-anchor="middle">table people: 10,000 rows</text>
  <text x="995" y="704" font-size="12" fill="#3b4252" text-anchor="middle">id (PK) · name · email (no index) · city</text>
  <line x1="995" y1="584" x2="995" y2="610" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- response path back -->
  <path d="M340,284 L340,214 L950,214 L950,198" fill="none" stroke="#2f5d3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="352" y="230" font-size="12" fill="#2f5d3a" font-weight="700">response with headers</text>

  <!-- requirements -->
  <rect x="60" y="604" width="330" height="132" rx="12" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="80" y="632" font-size="16" font-weight="700" fill="#1c2230">requirements.txt</text>
  <text x="80" y="656" font-size="13" fill="#3b4252">fastapi  (used)</text>
  <circle cx="88" cy="684" r="8" fill="#c2405a"/>
  <text x="88" y="688" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="102" y="688" font-size="12" font-weight="700" fill="#c2405a">requests==2.32.3  (never imported)</text>
  <circle cx="88" cy="710" r="8" fill="#c2405a"/>
  <text x="88" y="714" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="102" y="714" font-size="12" font-weight="700" fill="#c2405a">python-dateutil==2.9.0  (never imported)</text>

  <!-- Sensor mapping -->
  <text x="40" y="796" font-size="16" font-weight="700" fill="#1c2230">Which sensor sees which problem</text>
  <rect x="40" y="812" width="280" height="34" rx="6" fill="#e8607a"/>
  <text x="180" y="834" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Dead code → routes.py, legacy-charts.js</text>
  <rect x="330" y="812" width="240" height="34" rx="6" fill="#3fa0a8"/>
  <text x="450" y="834" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Unused libraries → requirements.txt</text>
  <rect x="580" y="812" width="290" height="34" rx="6" fill="#3fa0a8"/>
  <text x="725" y="834" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">p95 latency → GET /people?limit=5000</text>
  <rect x="880" y="812" width="280" height="34" rx="6" fill="#3fa0a8"/>
  <text x="1020" y="834" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Error rate → GET /people/{id}</text>

  <circle cx="48" cy="874" r="8" fill="#c2405a"/>
  <text x="48" y="878" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="62" y="878" font-size="13" fill="#3b4252">planted problem (the agent should fix it through a PR)</text>
  <rect x="470" y="866" width="18" height="18" rx="3" fill="#e8607a"/>
  <text x="496" y="880" font-size="13" fill="#3b4252">Inferential</text>
  <rect x="590" y="866" width="18" height="18" rx="3" fill="#3fa0a8"/>
  <text x="616" y="880" font-size="13" fill="#3b4252">Computational</text>
</svg>
