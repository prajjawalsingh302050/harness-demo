name: health-check

# Continuous drift + runtime sensors -> coding agent -> pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # every day 08:00 IST

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      # run_sensors.sh ends with build_report.py, which writes healthy=true/false to $GITHUB_OUTPUT.
      - name: Run sensors and build report
        id: report
        run: bash scripts/run_sensors.sh
        env:
          DURATION: "20"

      - name: Show report
        run: cat reports/health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to health-reports branch
        run: bash scripts/publish_report.sh

      - name: Upload sensor outputs
        uses: actions/upload-artifact@v4
        with:
          name: sensor-reports
          path: reports/

      - name: Coding agent (Gemini)
        id: agent
        if: steps.report.outputs.healthy == 'false' && env.GEMINI_API_KEY != ''
        run: python scripts/agent.py

      - name: Open pull request
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard -- app api tests migrations public)" ]; then
            echo "Agent made no changes."
            exit 0
          fi
          branch="agent/health-fix-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "harness-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A app api tests migrations public requirements.txt data
          git commit -m "$(cat reports/pr-title.txt)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "$(cat reports/pr-title.txt)" \
            --body-file reports/pr-body.md \
            --label "harness-agent" || \
          gh pr create --base main --head "$branch" \
            --title "$(cat reports/pr-title.txt)" \
            --body-file reports/pr-body.md

      - name: No API key
        if: steps.report.outputs.healthy == 'false' && env.GEMINI_API_KEY == ''
        run: echo "::warning::Checks are failing but GEMINI_API_KEY is not set, so the coding agent was skipped."
