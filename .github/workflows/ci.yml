name: ci

# Tests every change: on pull requests, on pushes to main, or by hand.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Download the code and install Python 3.12 with cached packages.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The committed data/shop.db must match migrations/.
      - name: Database matches migrations
        run: python scripts/build_db.py --check
      - name: Tests
        run: python -m pytest -q
