<!doctype html>
<html lang="en">
<head>
  <!-- People page: a table of people with "Load 50" and "Load 5000" buttons. Logic: app.js -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Harness Demo</h1>
    <nav>
      <a href="/">People</a>
      <a href="/person.html?id=1">Person</a>
      <a href="/health.html">Health</a>
      <a href="/architecture.html">How it works</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <div class="toolbar">
        <button data-limit="50">Load 50 people</button>
        <button class="primary" data-limit="5000">Load 5000 people</button>
        <span id="count" class="muted"></span>
        <div class="metrics" id="metrics"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>City</th></tr>
          </thead>
          <tbody id="people">
            <tr><td colspan="4" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
