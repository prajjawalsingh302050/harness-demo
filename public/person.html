<!doctype html>
<html lang="en">
<head>
  <!-- Person page: look up one person by id. Logic: person.js -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Person</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Harness Demo</h1>
    <nav>
      <a href="/">People</a>
      <a href="/person.html?id=1">Person</a>
      <a href="/health.html">Health</a>
      <a href="/architecture.html">How it works</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <form id="lookup" class="toolbar">
        <label for="person-id">Person ID</label>
        <input id="person-id" type="number" min="1" value="1">
        <button class="primary" type="submit">Look up</button>
        <span class="muted">Try 1–10000, or 15000 for a missing person</span>
        <div class="metrics" id="metrics"></div>
      </form>
      <div id="person"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/person.js"></script>
</body>
</html>
